[[redirects]]
  from = "/how-it-works"
  to = "/pages/how-it-works.html"
  status = 200

[[redirects]]
  from = "/sample-report"
  to = "/pages/sample-report.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/get-my-review"
  to = "/pages/get-my-review.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://buy.stripe.com; base-uri 'self'; form-action 'self' https://buy.stripe.com; frame-ancestors 'none'"
