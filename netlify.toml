[[redirects]]
  from = "/how-it-works"
  to = "/pages/how-it-works.html"
  status = 200

[[redirects]]
  from = "/sample-report"
  to = "/pages/sample-report.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/get-my-review"
  to = "/pages/get-my-review.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
